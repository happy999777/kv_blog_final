{% extends 'base.html' %}
{% block title %}Set New Password — KV Blog{% endblock %}
{% block content %}
<section class="auth-section">
  <div class="container">
    <div class="auth-card">
      <div class="auth-logo"><span class="kv-logo" style="font-size:2.5rem">KV</span></div>
      <h1 class="auth-title">New Password</h1>
      <p class="auth-subtitle">Choose a strong new password for your account</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">New Password</label>
          <div class="input-icon-wrap" style="position:relative">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" name="password1" class="form-control" placeholder="New password" required style="padding-right:42px">
            <button type="button" class="password-toggle"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <div class="mb-4">
          <label class="form-label">Confirm Password</label>
          <div class="input-icon-wrap" style="position:relative">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" name="password2" class="form-control" placeholder="Confirm password" required style="padding-right:42px">
            <button type="button" class="password-toggle"><i class="fas fa-eye"></i></button>
          </div>
        </div>
        <button type="submit" class="btn-primary-custom w-100 justify-content-center" style="padding:13px">
          <i class="fas fa-key me-2"></i>Update Password
        </button>
      </form>
    </div>
  </div>
</section>
{% endblock %}
